<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>大幅网点图分条打样 · Floyd–Steinberg 误差扩散</title>
<style>
  :root {
    --bg:#0f1420; --panel:#171e2e; --line:#2a3550; --text:#e6ebf5;
    --muted:#8a97b1; --accent:#5b8cff; --ok:#2fbf71; --warn:#ff8a3d;
    --bad:#ff5d6c; --black-mark:#4080ff; --white-mark:#ff5050;
  }
  * { box-sizing:border-box; }
  body { margin:0; font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
         background:var(--bg); color:var(--text); font-size:14px; }
  header { padding:14px 22px; border-bottom:1px solid var(--line);
           display:flex; align-items:baseline; gap:14px; flex-wrap:wrap; }
  header h1 { font-size:17px; margin:0; }
  header .sub { color:var(--muted); font-size:12px; }
  .layout { display:grid; grid-template-columns:300px 1fr; min-height:calc(100vh - 52px); }
  aside { background:var(--panel); border-right:1px solid var(--line);
          padding:16px; overflow:auto; }
  main { padding:18px 22px; overflow:auto; }
  .card { border:1px solid var(--line); border-radius:10px; padding:13px; margin-bottom:14px;
          background:#121a2b; }
  .card h2 { font-size:13px; margin:0 0 10px; color:var(--accent); letter-spacing:.5px; }
  label { display:block; color:var(--muted); margin:8px 0 4px; font-size:12px; }
  input[type=number], input[type=text] {
    width:100%; background:#0d1322; border:1px solid var(--line); color:var(--text);
    border-radius:6px; padding:7px 9px; font-size:13px; }
  button { cursor:pointer; border:1px solid var(--line); background:#1d2740; color:var(--text);
           border-radius:7px; padding:8px 11px; font-size:13px; margin:3px 4px 3px 0; }
  button:hover { border-color:var(--accent); }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  button.danger { color:var(--bad); }
  .modes label { display:inline-flex; align-items:center; gap:5px; color:var(--text);
                 margin:0 8px 0 0; font-size:13px; }
  .modes { display:flex; gap:6px; flex-wrap:wrap; }
  .kv { display:flex; justify-content:space-between; font-size:12px; color:var(--muted);
        padding:2px 0; }
  .kv b { color:var(--text); font-weight:600; }
  .strip-item { display:flex; justify-content:space-between; align-items:center;
                border:1px solid var(--line); border-radius:7px; padding:6px 9px; margin:6px 0;
                font-size:12px; background:#0d1322; }
  .strip-item button { padding:2px 7px; margin:0; font-size:11px; }
  .canvas-wrap { position:relative; display:inline-block; background:#0a0f1a;
                 border:1px solid var(--line); border-radius:8px; overflow:auto; max-width:100%; }
  canvas { display:block; image-rendering:pixelated; }
  .overlay { position:absolute; inset:0; }
  .legend { display:flex; gap:14px; flex-wrap:wrap; color:var(--muted); font-size:12px;
            margin:8px 0; }
  .swatch { display:inline-block; width:11px; height:11px; border-radius:2px;
            vertical-align:-1px; margin-right:4px; }
  .msg { border-radius:8px; padding:10px 12px; margin:8px 0; font-size:13px; line-height:1.55; }
  .msg.ok { background:rgba(47,191,113,.12); border:1px solid var(--ok); }
  .msg.bad { background:rgba(255,93,108,.12); border:1px solid var(--bad); }
  .msg.info { background:rgba(91,140,255,.10); border:1px solid var(--accent); }
  .rev-item { font-size:12px; border-left:3px solid var(--line); padding:5px 9px; margin:6px 0;
              color:var(--muted); }
  .rev-item.latest { border-left-color:var(--ok); color:var(--text); }
  .tabs { display:flex; gap:6px; margin-bottom:10px; }
  .tabs button.active { background:var(--accent); border-color:var(--accent); color:#fff; }
  .muted { color:var(--muted); }
  code { background:#0d1322; padding:1px 5px; border-radius:4px; }
  .uploader { border:1px dashed var(--line); border-radius:9px; padding:16px; text-align:center; }
  .uploader input { display:none; }
  .uploader label { color:var(--text); margin:0; cursor:pointer; }
  button.tool-active { background:#0aa6c2; border-color:#00e5ff; color:#04121a; font-weight:700; }
  .pf-levels { display:flex; flex-wrap:wrap; gap:3px; margin:8px 0 2px; }
  .pf-chip { min-width:27px; text-align:center; font-size:11px; line-height:1.5;
             border-radius:5px; border:1px solid var(--line); color:var(--muted);
             background:#0d1322; padding:1px 3px; }
  .pf-chip.ok { color:#06281a; background:var(--ok); border-color:var(--ok); font-weight:700; }
  .pf-chip.bad { color:#3a0d12; background:rgba(255,93,108,.75); border-color:var(--bad); }
  .pf-chip.peak { outline:2px solid #00e5ff; outline-offset:1px; }
  .pf-mini { font-size:12px; color:var(--muted); margin:4px 0; line-height:1.5; }
  .pf-mini b { color:var(--text); }
  #overlay.pf-on { cursor:crosshair; }
</style>
</head>
<body>
<header>
  <h1>大幅网点图分条打样系统</h1>
  <span class="sub">Floyd–Steinberg 误差扩散 · 8 位灰度 PNG（宽高 ≤ 2048）· 续算与从头重算逐像素一致</span>
</header>

<div class="layout">
  <aside>
    <div class="card">
      <h2>1. 输入图像</h2>
      <div class="uploader">
        <input id="file" type="file" accept="image/png" />
        <label for="file">点击选择灰度 PNG 上传</label>
      </div>
      <button class="primary" id="btnSample" style="width:100%;margin-top:9px;">载入内置样图（演示改色波及条带）</button>
      <button id="btnPfDemo" style="width:100%;margin-top:7px;">载入反白细线预检演示图</button>
      <div id="imgInfo" class="muted" style="margin-top:8px;font-size:12px;"></div>
    </div>

    <div class="card">
      <h2>2. 已打样条带（按行号）</h2>
      <label>起始行（1 基，含）</label>
      <input id="stripTop" type="number" min="1" placeholder="例如 33" />
      <label>结束行（1 基，含）</label>
      <input id="stripBottom" type="number" min="1" placeholder="例如 64" />
      <label>备注（可选）</label>
      <input id="stripLabel" type="text" placeholder="例如 第一批已打样" />
      <button class="primary" id="btnAddStrip" style="width:100%;margin-top:8px;">登记条带</button>
      <div id="stripList"></div>
    </div>

    <div class="card">
      <h2>3. 框选强制色</h2>
      <div class="modes">
        <label><input type="radio" name="mode" value="black" checked />
          <span class="swatch" style="background:var(--black-mark)"></span>强制黑</label>
        <label><input type="radio" name="mode" value="white" />
          <span class="swatch" style="background:var(--white-mark)"></span>强制白</label>
        <label><input type="radio" name="mode" value="clear" />清除强制色</label>
      </div>
      <p class="muted" style="font-size:12px;margin:8px 0 0;">
        在右侧预览上按住鼠标拖出矩形，松开即提交。系统从最近检查点续算
        （最多回退 31 行），并逐像素比对所有已打样条带。</p>
      <div id="rectInfo" class="muted" style="font-size:12px;margin-top:6px;"></div>
    </div>

    <div class="card">
      <h2>4. 反白细线预检（扩墨 0–16 档）</h2>
      <button id="btnPfTool" style="width:100%;">📐 框选预检区域（宽高 ≤ 256）</button>
      <div id="pfStep" class="pf-mini" style="margin-top:8px;">
        未启用。点上方按钮后，在成稿上拖出预检框，再在框内依次点两个不同的成稿白点。
      </div>
      <div id="pfInfo" class="pf-mini"></div>
      <div id="pfResult"></div>
      <button id="btnPfRerun" style="width:100%;margin-top:6px;" disabled>用原框和端点重测</button>
      <button id="btnPfClear" class="danger" style="width:100%;margin-top:6px;">清除预检框 / 端点 / 通道</button>
    </div>

    <div class="card">
      <h2>5. 输出</h2>
      <button id="btnDownload" class="primary" style="width:100%;">下载当前稿黑白 PNG</button>
      <div class="legend" style="margin-top:8px;">
        <span><span class="swatch" style="background:var(--black-mark)"></span>强制黑</span>
        <span><span class="swatch" style="background:var(--white-mark)"></span>强制白</span>
        <span><span class="swatch" style="background:#00dc5a"></span>候选变色点</span>
        <span><span class="swatch" style="background:#ffaa00"></span>条带首个变色点</span>
        <span><span class="swatch" style="background:#00e5ff"></span>预检框</span>
        <span><span class="swatch" style="background:#19ff9c"></span>最高档最短通道</span>
      </div>
    </div>
  </aside>

  <main>
    <div class="tabs">
      <button data-view="out" class="active">二值成稿</button>
      <button data-view="force">强制色叠加</button>
      <button data-view="gray">原始灰度</button>
      <button data-view="pending">被拒候选稿</button>
    </div>
    <div id="messages"></div>
    <div class="canvas-wrap" id="canvasWrap">
      <canvas id="canvas"></canvas>
      <canvas id="overlay" class="overlay"></canvas>
    </div>
    <div class="card" style="margin-top:14px;">
      <h2>稿件链与缓存预算</h2>
      <div id="budget"></div>
      <div id="revList" style="margin-top:8px;"></div>
    </div>
  </main>
</div>

<script>
const $ = (id) => document.getElementById(id);
let state = null;
let view = "out";
let imgCache = {};
let drag = null;

// 反白预检的全部交互状态。box 为半开像素区间 {x0,y0,x1,y1}。
// result 仅存放“已通过过期校验、当前正在展示”的响应；等待期间为 null，
// 从而保证“等待时撤下旧结论（含通道线）”。
let pf = {
  active: false,
  box: null,
  eps: [],
  result: null,
  waiting: false,
  error: null,
  token: 0,
};
let outReader = null; // {sid, rid, w, h, data}

function msg(kind, html) {
  const el = document.createElement("div");
  el.className = "msg " + kind;
  el.innerHTML = html;
  $("messages").prepend(el);
  setTimeout(() => el.remove(), 12000);
}

async function api(url, opts) {
  const r = await fetch(url, opts);
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || ("HTTP " + r.status));
  return data;
}

async function loadImage(url) {
  const r = await fetch(url);
  const blob = await r.blob();
  const bmp = await createImageBitmap(blob);
  return bmp;
}

async function refresh(sess) {
  const oldSid = state ? state.session_id : null;
  state = sess || (await api("/api/session/" + state.session_id));
  const sid = state.session_id;
  if (oldSid && oldSid !== sid) resetPfAll();   // 换了图像/会话：预检状态全部归零
  outReader = null;                             // 成稿像素读取缓存按 revision 失效
  $("imgInfo").innerHTML =
    `尺寸 <b>${state.width} × ${state.height}</b> · 会话 <code>${sid.slice(0,8)}</code>`;
  // 条带
  $("stripList").innerHTML = state.strips.length
    ? state.strips.map(s =>
        `<div class="strip-item"><span>${s.label}：第 ${s.top_line}–${s.bottom_line} 行（0基 ${s.top}–${s.bottom - 1}）</span>
         <button class="danger" onclick="delStrip(${s.index})">删除</button></div>`).join("")
    : `<div class="muted" style="font-size:12px;">尚未登记条带</div>`;
  // 预算
  const b = state.buffer_budget;
  $("budget").innerHTML = [
    ["检查点缓存行 ⌈H/32⌉", b.checkpoint_rows],
    ["工作区行", b.workspace_rows],
    ["物理全宽误差行合计", b.physical_rows],
    ["检查点间距 / 最大回退", `${b.block} 行 / ${b.max_rollback} 行`],
  ].map(([k, v]) => `<div class="kv"><span>${k}</span><b>${v}</b></div>`).join("");
  // 稿件链
  $("revList").innerHTML = state.revisions.map((r, i) =>
    `<div class="rev-item ${r.revision_id === state.current_revision_id ? "latest" : ""}">
       #${i} ${r.note}<br/>
       强制色：黑 ${r.force.black} / 白 ${r.force.white}
       ${r.resume_start !== null ? `· 续算起点行 ${r.resume_start}（0基）· 改动行 ${r.changed_rows.join(",")}` : "· 全量从头抖动"}
       <br/>缓存驻留 ${r.buffer_stats.resident_rows}/${r.buffer_stats.capacity} 行
     </div>`).join("");
  // 图像
  imgCache = {};
  await drawView();
}

async function drawView() {
  if (!state) return;
  const sid = state.session_id;
  const urls = {
    gray: `/api/session/${sid}/image/gray`,
    out: `/api/session/${sid}/image/out`,
    force: `/api/session/${sid}/image/force`,
    pending: `/api/session/${sid}/pending/image`,
  };
  const cv = $("canvas"), ov = $("overlay");
  cv.width = ov.width = state.width;
  cv.height = ov.height = state.height;
  const ctx = cv.getContext("2d");
  ctx.clearRect(0, 0, cv.width, cv.height);
  let key = view;
  if (view === "pending" && !state.pending) {
    msg("info", "当前没有被拒绝的候选稿，显示二值成稿。");
    key = "out";
  }
  try {
    if (!imgCache[key]) imgCache[key] = await loadImage(urls[key]);
    ctx.drawImage(imgCache[key], 0, 0);
  } catch (e) {
    if (!imgCache.out) imgCache.out = await loadImage(urls.out);
    ctx.drawImage(imgCache.out, 0, 0);
  }
  drawOverlay();
}

function drawOverlay() {
  const ov = $("overlay");
  const ctx = ov.getContext("2d");
  ctx.clearRect(0, 0, ov.width, ov.height);
  // 条带：青色横线 + 半透明填充
  for (const s of state.strips) {
    ctx.fillStyle = "rgba(0,200,220,0.10)";
    ctx.fillRect(0, s.top, ov.width, s.bottom - s.top);
    ctx.strokeStyle = "rgba(0,220,240,0.9)";
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(0, s.top + 0.5); ctx.lineTo(ov.width, s.top + 0.5);
    ctx.moveTo(0, s.bottom - 0.5); ctx.lineTo(ov.width, s.bottom - 0.5);
    ctx.stroke();
    ctx.fillStyle = "rgba(0,220,240,1)";
    ctx.font = "12px sans-serif";
    ctx.fillText(s.label, 4, s.top + 13);
  }
  // 被拒候选稿的首个变色点
  if (state.pending && state.pending.violations) {
    for (const v of state.pending.violations) {
      const [r, c] = v.first_point;
      ctx.strokeStyle = "#ffaa00";
      ctx.lineWidth = 1.5;
      ctx.strokeRect(c - 5, r - 5, 10, 10);
      ctx.beginPath();
      ctx.moveTo(c - 8, r); ctx.lineTo(c + 8, r);
      ctx.moveTo(c, r - 8); ctx.lineTo(c, r + 8);
      ctx.stroke();
    }
  }
  // 反白预检：框、最高档通道、端点
  drawPfOverlay(ctx);

  // 拖拽矩形（强制色 = 黄色；预检框 = 青色，过大 = 红色）
  if (drag) {
    if (drag.kind === "pf") {
      const x0 = Math.min(drag.x0, drag.x1), y0 = Math.min(drag.y0, drag.y1);
      const bw = Math.abs(drag.x1 - drag.x0) + 1, bh = Math.abs(drag.y1 - drag.y0) + 1;
      const tooBig = bw > 256 || bh > 256;
      ctx.fillStyle = tooBig ? "rgba(255,93,108,.10)" : "rgba(0,229,255,.08)";
      ctx.fillRect(x0, y0, bw, bh);
      ctx.strokeStyle = tooBig ? "#ff5d6c" : "#00e5ff";
      ctx.lineWidth = 1;
      ctx.setLineDash([5, 3]);
      ctx.strokeRect(x0 + 0.5, y0 + 0.5, bw - 1, bh - 1);
      ctx.setLineDash([]);
      ctx.fillStyle = tooBig ? "#ff8b96" : "#9ff3ff";
      ctx.font = "12px sans-serif";
      ctx.fillText(`${bw} × ${bh}${tooBig ? "  超过 256 上限" : ""}`, x0 + 4, y0 - 6 < 10 ? y0 + 14 : y0 - 6);
    } else {
      ctx.strokeStyle = "#ffd23d";
      ctx.lineWidth = 1;
      ctx.setLineDash([4, 3]);
      const x = Math.min(drag.x0, drag.x1), y = Math.min(drag.y0, drag.y1);
      ctx.strokeRect(x + 0.5, y + 0.5, Math.abs(drag.x1 - drag.x0), Math.abs(drag.y1 - drag.y0));
      ctx.setLineDash([]);
    }
  }
}

function drawPfOverlay(ctx) {
  // 已确定的预检框
  if (pf.box) {
    const b = pf.box;
    ctx.fillStyle = "rgba(0,229,255,.06)";
    ctx.fillRect(b.x0, b.y0, b.x1 - b.x0, b.y1 - b.y0);
    ctx.strokeStyle = pf.active ? "#00e5ff" : "rgba(0,229,255,.75)";
    ctx.lineWidth = 1.5;
    ctx.setLineDash([6, 3]);
    ctx.strokeRect(b.x0 + 0.5, b.y0 + 0.5, b.x1 - b.x0 - 1, b.y1 - b.y0 - 1);
    ctx.setLineDash([]);
    ctx.fillStyle = "#9ff3ff";
    ctx.font = "12px sans-serif";
    ctx.fillText(`预检框 ${b.x1 - b.x0}×${b.y1 - b.y0}`, b.x0 + 5, b.y0 + 15);
  }

  // 最高档最短通道（等待/零档断时 result 为 null 或 path 为空 → 不画线）
  const path = pf.result && Array.isArray(pf.result.path) ? pf.result.path : [];
  if (!pf.waiting && path.length >= 2) {
    ctx.lineJoin = "round";
    ctx.lineCap = "round";
    ctx.beginPath();
    path.forEach(([x, y], i) => {
      if (i === 0) ctx.moveTo(x + 0.5, y + 0.5);
      else ctx.lineTo(x + 0.5, y + 0.5);
    });
    ctx.strokeStyle = "rgba(0,0,0,.65)";
    ctx.lineWidth = 4;
    ctx.stroke();
    ctx.strokeStyle = "#19ff9c";
    ctx.lineWidth = 1.8;
    ctx.stroke();
  }

  // 端点 A / B
  pf.eps.forEach((p, i) => {
    ctx.beginPath();
    ctx.arc(p.x + 0.5, p.y + 0.5, 3.4, 0, Math.PI * 2);
    ctx.fillStyle = "#ffffff";
    ctx.fill();
    ctx.lineWidth = 1.6;
    ctx.strokeStyle = i === 0 ? "#1d6cff" : "#e0245e";
    ctx.stroke();
    ctx.fillStyle = i === 0 ? "#1d6cff" : "#e0245e";
    ctx.font = "bold 11px sans-serif";
    ctx.fillText(i === 0 ? "A" : "B", p.x + 5, p.y - 5);
  });
}

function eventPos(e) {
  const rect = $("canvas").getBoundingClientRect();
  const sx = $("canvas").width / rect.width, sy = $("canvas").height / rect.height;
  return {
    x: Math.max(0, Math.min(state.width - 1, Math.floor((e.clientX - rect.left) * sx))),
    y: Math.max(0, Math.min(state.height - 1, Math.floor((e.clientY - rect.top) * sy))),
  };
}

$("overlay").addEventListener("mousedown", (e) => {
  if (!state) return;
  const p = eventPos(e);
  if (pf.active) {
    drag = { kind: "pf", x0: p.x, y0: p.y, x1: p.x, y1: p.y, cx: e.clientX, cy: e.clientY };
  } else {
    drag = { kind: "force", x0: p.x, y0: p.y, x1: p.x, y1: p.y };
  }
});
window.addEventListener("mousemove", (e) => {
  if (!drag) return;
  const p = eventPos(e);
  drag.x1 = p.x; drag.y1 = p.y;
  if (drag.kind === "force") {
    $("rectInfo").textContent =
      `框选：x ${Math.min(drag.x0, drag.x1)}–${Math.max(drag.x0, drag.x1)}，` +
      `y ${Math.min(drag.y0, drag.y1)}–${Math.max(drag.y0, drag.y1)}（0基像素）`;
  }
  drawOverlay();
});
window.addEventListener("mouseup", async (e) => {
  if (!drag) return;
  const d = drag; drag = null;
  if (d.kind === "pf") { await handlePfMouseUp(e, d); return; }
  if (Math.abs(d.x1 - d.x0) < 1 && Math.abs(d.y1 - d.y0) < 1) { drawOverlay(); return; }
  const mode = document.querySelector("input[name=mode]:checked").value;
  // 若当前已有完整预检，换稿一旦被接受就要按原框/端点重测：
  // 先撤下旧结论，避免 refresh 重绘时残留旧通道线。
  const hadCompletePf = !!(pf.box && pf.eps.length === 2);
  try {
    const data = await api(`/api/session/${state.session_id}/force`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ x0: d.x0, y0: d.y0, x1: d.x1 + 1, y1: d.y1 + 1, mode }),
    });
    // 请求往返期间用户可能已清除/改动预检：仅在仍是同一组完整条件时撤旧结论
    if (data.result.accepted && hadCompletePf && pf.box && pf.eps.length === 2) {
      withdrawPfConclusion();
    }
    await refresh(data.session);
    const r = data.result;
    if (r.accepted) {
      msg("ok", `✅ 新稿已接受：续算起点第 <b>${r.resume_start}</b> 行（0基），` +
        `改动行 ${r.changed_rows.join(", ")}，所有已打样条带均未变色。` +
        (hadCompletePf ? "<br/>预检框与端点保持不变，正在按新稿重测…" : ""));
      view = "out";
      syncTabs();
    } else if (r.violations && r.violations.length) {
      msg("bad", "⛔ 换稿被拒绝：已打样条带内出现网点变色，<b>旧稿及其强制色已保留</b>。<br/>" +
        r.violations.map(v =>
          `· ${v.label}（行 ${v.top + 1}–${v.bottom}）首个变色点：` +
          `第 ${v.first_point[0] + 1} 行 第 ${v.first_point[1] + 1} 列`).join("<br/>") +
        `<br/>可切换到「被拒候选稿」页签查看绿色变色区域与橙色标记。` +
        (hadCompletePf && pf.result ? "<br/><b>当前预检结论沿用不变。</b>" : ""));
      view = "pending";
      syncTabs();
    } else {
      msg("info", r.note || "强制色无实际变化。");
    }
    await drawView();
    if (r.accepted && pf.box && pf.eps.length === 2) runPreflight();
  } catch (err) { msg("bad", err.message); }
});

function syncTabs() {
  document.querySelectorAll(".tabs button").forEach(b =>
    b.classList.toggle("active", b.dataset.view === view));
}

document.querySelectorAll(".tabs button").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".tabs button").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    view = btn.dataset.view;
    drawView();
  });
});

// ================================================================ 反白预检
function resetPfAll() {
  // 会话切换时清空框/端点/结论与在途请求，但保留预检工具开关，
  // 避免 refresh 的 await 期间极快的按下被误判成强制色拖框。
  pf.box = null;
  pf.eps = [];
  pf.result = null;
  pf.waiting = false;
  pf.error = null;
  pf.token++;
  outReader = null;
  updatePfToolButton();
  renderPfPanel();
}

function withdrawPfConclusion() {
  // 换稿成功、即将按原条件重测：立刻撤下旧结论与通道线，进入等待态。
  pf.result = null;
  pf.error = null;
  pf.waiting = true;
  pf.token++;
  renderPfPanel();
  drawOverlay();
}

function updatePfToolButton() {
  const btn = $("btnPfTool");
  const ov = $("overlay");
  if (!btn) return;
  btn.textContent = pf.active
    ? "⏹ 预检进行中：拖新框 / 点端点（点此回到强制色）"
    : "📐 框选预检区域（宽高 ≤ 256）";
  btn.classList.toggle("tool-active", pf.active);
  ov.classList.toggle("pf-on", pf.active);
}

$("btnPfTool").addEventListener("click", () => {
  if (!state) { msg("bad", "请先载入或上传图像。"); return; }
  pf.active = !pf.active;
  updatePfToolButton();
  if (pf.active) {
    msg("info", "预检模式：先在成稿上<b>拖出</b>宽高 ≤256 的检查框，再在框内<b>单击</b>两个不同的白点。" +
      "再次点左侧按钮可回到强制色框选。");
  }
  renderPfPanel();
});

$("btnPfClear").addEventListener("click", () => {
  pf.box = null; pf.eps = []; pf.result = null;
  pf.waiting = false; pf.error = null; pf.token++;
  renderPfPanel(); drawOverlay();
});

$("btnPfRerun").addEventListener("click", () => runPreflight());

async function handlePfMouseUp(ev, d) {
  const moved = Math.hypot(ev.clientX - d.cx, ev.clientY - d.cy);
  const p = eventPos(ev);
  if (moved < 5) { await pickEndpoint(p); return; }
  // 拖框：按 inclusive 像素角点归一化为半开区间
  const x0 = Math.min(d.x0, p.x), y0 = Math.min(d.y0, p.y);
  const x1 = Math.max(d.x0, p.x) + 1, y1 = Math.max(d.y0, p.y) + 1;
  const bw = x1 - x0, bh = y1 - y0;
  if (bw > 256 || bh > 256) {
    msg("bad", `预检框宽高各至多 256 像素，本次为 ${bw}×${bh}，请重新框选。`);
    drawOverlay();
    return;
  }
  pf.box = { x0, y0, x1, y1 };
  pf.eps = []; pf.result = null; pf.error = null;
  pf.waiting = false; pf.token++;
  renderPfPanel(); drawOverlay();
}

async function getOutReader() {
  const rid = state.current_revision_id;
  if (outReader && outReader.sid === state.session_id && outReader.rid === rid) {
    return outReader;
  }
  const bmp = await loadImage(
    `/api/session/${state.session_id}/image/out?rid=${encodeURIComponent(rid)}`);
  const c = document.createElement("canvas");
  c.width = bmp.width; c.height = bmp.height;
  const cx = c.getContext("2d", { willReadFrequently: true });
  cx.drawImage(bmp, 0, 0);
  const data = cx.getImageData(0, 0, c.width, c.height).data;
  outReader = { sid: state.session_id, rid, w: c.width, h: c.height, data };
  return outReader;
}

async function isWhitePixel(x, y) {
  try {
    const r = await getOutReader();
    if (x < 0 || y < 0 || x >= r.w || y >= r.h) return false;
    return r.data[(y * r.w + x) * 4] === 255;
  } catch (e) {
    return true; // 读回失败时不拦点击，由后端判定
  }
}

async function pickEndpoint(p) {
  if (!pf.box) {
    msg("info", "请先在成稿上拖出预检框，再点端点。");
    return;
  }
  const b = pf.box;
  if (p.x < b.x0 || p.x >= b.x1 || p.y < b.y0 || p.y >= b.y1) {
    msg("bad", `端点 (${p.x},${p.y}) 不在预检框 [${b.x0},${b.x1})×[${b.y0},${b.y1}) 内。`);
    return;
  }
  if (!(await isWhitePixel(p.x, p.y))) {
    msg("bad", `端点 (${p.x},${p.y}) 在当前成稿中不是白点，请点反白细线内的白点。`);
    return;
  }
  if (pf.eps.some(q => q.x === p.x && q.y === p.y)) {
    msg("bad", "两个端点必须是不同的像素，请重新点第二个端点。");
    return;
  }
  if (pf.eps.length >= 2) pf.eps = [p];   // 已有点满两个：本次点击作为新的 A
  else pf.eps.push(p);
  pf.result = null; pf.error = null; pf.token++;
  renderPfPanel(); drawOverlay();
  if (pf.eps.length === 2) await runPreflight();
}

function sameSnap(a, b) {
  return a.sid === b.sid &&
    a.rid === b.rid &&
    a.box.x0 === b.box.x0 && a.box.y0 === b.box.y0 &&
    a.box.x1 === b.box.x1 && a.box.y1 === b.box.y1 &&
    a.eps.length === b.eps.length &&
    a.eps.every((p, i) => p.x === b.eps[i].x && p.y === b.eps[i].y);
}

async function runPreflight() {
  if (!state || !pf.box || pf.eps.length !== 2) { renderPfPanel(); return; }
  const snap = {
    sid: state.session_id,
    rid: state.current_revision_id,
    box: { ...pf.box },
    eps: pf.eps.map(p => ({ ...p })),
  };
  const token = ++pf.token;
  pf.waiting = true; pf.result = null; pf.error = null;
  renderPfPanel(); drawOverlay();
  try {
    const data = await api(`/api/session/${snap.sid}/preflight`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        x0: snap.box.x0, y0: snap.box.y0, x1: snap.box.x1, y1: snap.box.y1,
        endpoints: snap.eps.map(p => [p.x, p.y]),
      }),
    });
    // 过期响应保护：会话/成稿版本、框、端点必须仍与发起时完全一致
    // （token 是补充手段，显式快照比对对应需求中的一致性条件）。
    const current = {
      sid: state ? state.session_id : null,
      rid: state ? state.current_revision_id : null,
      box: pf.box ? { ...pf.box } : null,
      eps: pf.eps.map(p => ({ ...p })),
    };
    if (token !== pf.token || !pf.box || !sameSnap(snap, current) ||
        data.revision_id !== snap.rid) {
      return; // 已有更新的操作/换稿，本结果不得上屏
    }
    pf.waiting = false;
    pf.result = data;
    view = "out";
    syncTabs();
    renderPfPanel();
    await drawView();
  } catch (e) {
    const current = {
      sid: state ? state.session_id : null,
      rid: state ? state.current_revision_id : null,
      box: pf.box ? { ...pf.box } : null,
      eps: pf.eps.map(p => ({ ...p })),
    };
    if (token !== pf.token || !pf.box || !sameSnap(snap, current)) return;
    pf.waiting = false;
    pf.error = e.message;
    renderPfPanel();
  }
}

function renderPfPanel() {
  const step = $("pfStep"), info = $("pfInfo"), out = $("pfResult");
  if (!step) return;
  if (!pf.active && !pf.box) {
    step.innerHTML = "未启用。点上方按钮后，在成稿上拖出预检框，再在框内依次点两个不同的成稿白点。";
  } else if (pf.active && !pf.box) {
    step.innerHTML = "① 在成稿上<b>按住拖出</b>宽高 ≤256 的检查框。";
  } else if (pf.box && pf.eps.length === 0) {
    step.innerHTML = "② 在框内<b>单击</b>第一个白点（将标记为 A）。";
  } else if (pf.box && pf.eps.length === 1) {
    step.innerHTML = "③ 再单击另一个不同的白点作为 B，随后自动试算 0–16 档。";
  } else if (pf.waiting) {
    step.innerHTML = "④ 正在试算并等待成稿一致性确认…";
  } else {
    step.innerHTML = "完成。可拖动新框、单击端点重选，或用原框/端点重测。";
  }

  if (pf.box) {
    const b = pf.box;
    info.innerHTML =
      `框：(${b.x0},${b.y0})–(${b.x1 - 1},${b.y1 - 1})，` +
      `<b>${b.x1 - b.x0}×${b.y1 - b.y0}</b> 像素<br/>` +
      pf.eps.map((p, i) => `端点 ${i === 0 ? "A" : "B"}：<b>(${p.x},${p.y})</b>`).join("<br/>");
  } else {
    info.textContent = "";
  }

  $("btnPfRerun").disabled = !(pf.box && pf.eps.length === 2 && !pf.waiting);

  if (pf.waiting) {
    out.innerHTML = `<div class="msg info" style="margin:6px 0;">⏳ 正在按当前成稿试算 0–16 档，旧结论已撤下…</div>`;
    return;
  }
  if (pf.error) {
    out.innerHTML = `<div class="msg bad" style="margin:6px 0;">预检失败：${pf.error}</div>`;
    return;
  }
  const r = pf.result;
  if (!r) { out.innerHTML = ""; return; }

  const chips = r.levels.map(l => {
    const cls = l.connected ? "ok" : "bad";
    const peak = (r.max_level === l.level) ? " peak" : "";
    return `<span class="pf-chip ${cls}${peak}" title="${l.connected ? "连通，最短 " + l.shortest_length + " 边" : "断开"}">${l.level}</span>`;
  }).join("");
  if (r.max_level === null) {
    out.innerHTML =
      `<div class="msg bad" style="margin:6px 0;">⚠️ <b>零档已断</b>：${r.message}<br/>` +
      `<span style="font-size:12px;">已撤下通道线；0–16 档状态（绿=通，红=断）：</span>` +
      `<div class="pf-levels">${chips}</div></div>`;
  } else {
    out.innerHTML =
      `<div class="msg ok" style="margin:6px 0;">✅ 仍有通道的最高扩墨档：<b>${r.max_level} 像素</b><br/>` +
      `<span style="font-size:12px;">${r.message} 青色描边档位为最高档：</span>` +
      `<div class="pf-levels">${chips}</div></div>`;
  }
}

$("file").addEventListener("change", async (e) => {
  const f = e.target.files[0];
  if (!f) return;
  const fd = new FormData(); fd.append("image", f);
  try {
    const data = await api("/api/upload", { method: "POST", body: fd });
    await refresh(data);
    msg("ok", "上传成功，已生成第 0 稿（从头 Floyd–Steinberg 抖动）。");
    view = "out"; await drawView();
  } catch (err) { msg("bad", err.message); }
});

$("btnSample").addEventListener("click", async () => {
  try {
    const data = await api("/api/sample", { method: "POST" });
    await refresh(data);
    msg("ok", "已载入样图。建议流程：先登记条带（如第 1–64 行），再在条带下方框选强制黑/白，" +
      "观察误差扩散如何波及条带并触发拒绝；在条带影响区之外改色则可正常换稿。");
    view = "out"; await drawView();
  } catch (err) { msg("bad", err.message); }
});

$("btnPfDemo").addEventListener("click", async () => {
  try {
    const data = await api("/api/preflight-demo", { method: "POST" });
    pf.active = true;                 // 载入后直接进入预检交互
    await refresh(data);              // 新会话会 resetPfAll（其内部会把 active 置 false）
    pf.active = true;
    updatePfToolButton();
    renderPfPanel();
    view = "out";
    syncTabs();
    await drawView();
    msg("info",
      "预检演示图（纯黑白线稿）：① 框住上方 Z 形白线（约 x24–236、y48–96）；" +
      "② 在上横段、下横段中央各点一个白点（如 (44,59)、(214,85)），应得最高档 <b>1</b> 并画出最短通道。" +
      "随后关闭预检工具，在中间细颈上拖一个跨过白线的小强制黑框，换稿成功后会自动按原框/端点重测。" +
      "下半区白线中间有断口，可另框选验证“零档已断”。");
  } catch (err) { msg("bad", err.message); }
});

$("btnAddStrip").addEventListener("click", async () => {
  const top_line = parseInt($("stripTop").value, 10);
  const bottom_line = parseInt($("stripBottom").value, 10);
  const label = $("stripLabel").value.trim();
  if (!(top_line > 0) || !(bottom_line >= top_line)) {
    msg("bad", "条带行号非法：需要 1 ≤ 起始行 ≤ 结束行。"); return;
  }
  try {
    const data = await api(`/api/session/${state.session_id}/strips`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ top_line, bottom_line, label }),
    });
    await refresh(data);
    msg("ok", `条带已登记：第 ${top_line}–${bottom_line} 行。`);
  } catch (err) { msg("bad", err.message); }
});

window.delStrip = async (index) => {
  try {
    const data = await api(`/api/session/${state.session_id}/strips/${index}`,
      { method: "DELETE" });
    await refresh(data);
  } catch (err) { msg("bad", err.message); }
};

$("btnDownload").addEventListener("click", () => {
  if (!state) { msg("bad", "请先上传图像。"); return; }
  window.location = `/api/session/${state.session_id}/download`;
});
</script>
